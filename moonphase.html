<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月相查询 · MoonPhase</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000; color: #eceaf2;
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center; min-height: 100vh;
  }
  main { width: 100%; max-width: 540px; padding: 28px 18px 48px; text-align: center; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: .35em; text-indent: .35em; color: #f5f3eb; }
  .sub { color: #8b90a0; font-size: 12.5px; margin-top: 6px; letter-spacing: .12em; }
  #moonWrap { margin: 22px auto 4px; width: min(78vw, 400px); aspect-ratio: 1; }
  canvas#moon { width: 100%; height: 100%; display: block; }
  #phaseCn { font-size: 40px; font-weight: 700; margin-top: 10px; color: #f5f3eb;
             font-family: "Noto Serif CJK SC", serif; }
  #phaseEn { color: #a8adbd; letter-spacing: .28em; text-indent: .28em; font-size: 13px; margin-top: 4px; }
  .controls { display: flex; gap: 8px; justify-content: center; margin: 22px 0 6px; flex-wrap: wrap; }
  input[type="date"] {
    background: #14141c; color: #eceaf2; border: 1px solid #2c2c3a; border-radius: 10px;
    padding: 9px 12px; font-size: 15px; font-family: inherit;
  }
  button {
    background: #1d1d29; color: #eceaf2; border: 1px solid #34344a; border-radius: 10px;
    padding: 9px 16px; font-size: 14.5px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: #262636; }
  button.primary { background: #e8e4d8; color: #111; border-color: #e8e4d8; font-weight: 600; }
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; text-align: left;
  }
  .cell { background: #101018; border: 1px solid #23232f; border-radius: 12px; padding: 12px 14px; }
  .cell .k { color: #8b90a0; font-size: 12px; letter-spacing: .08em; }
  .cell .v { font-size: 17.5px; margin-top: 3px; }
  .wide { grid-column: 1 / -1; }
  .bar { height: 6px; background: #1c1c28; border-radius: 3px; margin-top: 9px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #6d7285, #e8e4d8); border-radius: 3px; }
  #cycle { margin-top: 22px; }
  #cycle .k { color: #8b90a0; font-size: 12px; letter-spacing: .1em; margin-bottom: 10px; }
  #strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  #strip figure { cursor: pointer; }
  #strip canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; background:#000; }
  #strip figcaption { font-size: 11px; color: #9aa0b0; margin-top: 4px; }
  #strip figure.on figcaption { color: #f5f3eb; font-weight: 600; }
  .foot { color: #565b6b; font-size: 11.5px; margin-top: 26px; line-height: 1.7; }
  #calBox, #yearBox { margin-top: 30px; }
  .calHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .calHead button { padding: 5px 14px; font-size: 17px; }
  .calTitle { font-size: 16.5px; font-weight: 600; letter-spacing: .12em; }
  .weekRow { display: grid; grid-template-columns: repeat(7, 1fr); color: #8b90a0; font-size: 12px; margin-bottom: 6px; }
  #calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { background: #101018; border: 1px solid #22222e; border-radius: 10px; padding: 5px 2px 6px; cursor: pointer; }
  .day.empty { background: transparent; border: none; cursor: default; }
  .day canvas { width: 82%; aspect-ratio: 1; display: block; margin: 0 auto; }
  .day .dn { font-size: 12.5px; margin-top: 2px; }
  .day .tag { font-size: 10px; color: #d8c98a; height: 13px; }
  .day.today { border-color: #6d7285; }
  .day.on { border-color: #e8e4d8; background: #1a1a26; }
  .yrRow {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 9px 12px; border: 1px solid #22222e; border-radius: 10px; margin-bottom: 7px;
    background: #101018; cursor: pointer; text-align: left;
  }
  .yrRow .dt { font-size: 14.5px; white-space: nowrap; }
  .yrRow .nm { color: #c9cdd8; font-size: 14px; }
  .yrRow .nm b { color: #f5f3eb; }
  .yrRow.newMoon .nm b { color: #9aa0b0; }
</style>
</head>
<body>
<main>
  <h1>月 相 查 询</h1>
  <div class="sub">MOONPHASE · 选个日期，看看那天的月亮</div>

  <div id="moonWrap"><canvas id="moon" width="720" height="720"></canvas></div>
  <div id="phaseCn">—</div>
  <div id="phaseEn">—</div>

  <div class="controls">
    <input type="date" id="dateInput" min="1900-01-01" max="2100-12-31">
    <button id="todayBtn">今天</button>
    <button id="dlBtn" class="primary">保存图片</button>
  </div>

  <div class="grid">
    <div class="cell"><div class="k">日期</div><div class="v" id="dateTxt">—</div></div>
    <div class="cell"><div class="k">农历</div><div class="v" id="lunarTxt">—</div></div>
    <div class="cell"><div class="k">照亮比例</div><div class="v" id="illumTxt">—</div></div>
    <div class="cell"><div class="k">月龄</div><div class="v" id="ageTxt">—</div></div>
    <div class="cell wide"><div class="k">本周期进度</div>
      <div class="bar"><div id="progBar" style="width:0%"></div></div>
      <div class="v" id="nextTxt" style="font-size:14.5px;margin-top:8px;color:#c9cdd8">—</div>
    </div>
  </div>

  <div id="cycle">
    <div class="k">这 一 个 周 期（点任意一个跳过去）</div>
    <div id="strip"></div>
  </div>

  <div id="calBox">
    <div class="calHead">
      <button id="calPrev">‹</button>
      <div class="calTitle" id="calTitle">—</div>
      <button id="calNext">›</button>
    </div>
    <div class="weekRow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div id="calGrid"></div>
  </div>

  <div id="yearBox">
    <div class="calHead">
      <button id="yrPrev">‹</button>
      <div class="calTitle" id="yrTitle">—</div>
      <button id="yrNext">›</button>
    </div>
    <div id="yrList"></div>
  </div>

  <div class="foot">月面纹理：Wikimedia Commons 满月照片（Luc Viatour）<br>月龄锚点：2000-01-06 18:14 UTC 新月 · 朔望月 29.530588853 天</div>
</main>

<script>
const SYNODIC = 29.530588853;
const ANCHOR = Date.UTC(2000, 0, 6, 18, 14);
const PHASES = [
  ["新月", "NEW MOON"], ["娥眉月", "WAXING CRESCENT"], ["上弦月", "FIRST QUARTER"],
  ["盈凸月", "WAXING GIBBOUS"], ["满月", "FULL MOON"], ["亏凸月", "WANING GIBBOUS"],
  ["下弦月", "LAST QUARTER"], ["残月", "WANING CRESCENT"]
];
const EVENTS = [[0, "新月"], [SYNODIC / 4, "上弦月"], [SYNODIC / 2, "满月"], [3 * SYNODIC / 4, "下弦月"]];

function ageOf(y, m, d) {
  const t = Date.UTC(y, m, d, 12, 0);
  return ((t - ANCHOR) / 86400000) % SYNODIC;
}
function phaseOf(age) {
  const idx = Math.floor(((age + SYNODIC / 16) % SYNODIC) / (SYNODIC / 8));
  const th = 2 * Math.PI * age / SYNODIC;
  return { name: PHASES[idx], illum: (1 - Math.cos(th)) / 2 };
}

// ---------- texture: real photo, procedural fallback ----------
let texData = null; // Float32Array grayscale at TEXN x TEXN
const TEXN = 480;
function buildProcedural() {
  const c = document.createElement("canvas"); c.width = c.height = TEXN;
  const g = c.getContext("2d");
  g.fillStyle = "#8a8a8a"; g.fillRect(0, 0, TEXN, TEXN);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 900; i++) { // maria blotches + craters
    const x = rnd() * TEXN, y = rnd() * TEXN, r = 4 + rnd() * 42;
    const dark = rnd() > 0.42;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const a = 0.05 + rnd() * 0.13;
    gr.addColorStop(0, dark ? `rgba(40,40,40,${a})` : `rgba(235,235,235,${a})`);
    gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  const img = g.getImageData(0, 0, TEXN, TEXN).data;
  texData = new Float32Array(TEXN * TEXN);
  for (let i = 0; i < TEXN * TEXN; i++) texData[i] = img[i * 4] / 255;
  refresh();
}
function loadTexture() {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = c.height = TEXN;
    const g = c.getContext("2d");
    const s = Math.min(img.width, img.height);
    g.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, TEXN, TEXN);
    const d = g.getImageData(0, 0, TEXN, TEXN).data;
    texData = new Float32Array(TEXN * TEXN);
    for (let i = 0; i < TEXN * TEXN; i++)
      texData[i] = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255;
    refresh();

// ---------- render one moon into a canvas ----------
function drawMoon(canvas, age, res) {
  res = res || TEXN;
  const N = canvas.width, ctx = canvas.getContext("2d");
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, N, N);
  // stars
  let seed = (Math.floor(age * 1000) % 997) + 13;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  ctx.fillStyle = "#cfd3de";
  for (let i = 0; i < N / 6; i++) {
    const x = rnd() * N, y = rnd() * N;
    if ((x - N / 2) ** 2 + (y - N / 2) ** 2 < (N * 0.40) ** 2) continue;
    ctx.globalAlpha = 0.25 + rnd() * 0.6;
    ctx.fillRect(x, y, 1.4, 1.4);
  }
  ctx.globalAlpha = 1;
  if (!texData) return;
  // render at texture resolution, then scale up
  const off = document.createElement("canvas"); off.width = off.height = res;
  const og = off.getContext("2d");
  const out = og.createImageData(res, res);
  const th = 2 * Math.PI * age / SYNODIC, st = Math.sin(th), ct = Math.cos(th);
  const R = res / 2, step = TEXN / res;
  for (let py = 0; py < res; py++) {
    const y = (py - R) / R;
    const ty = Math.min(TEXN - 1, Math.floor(py * step));
    for (let px = 0; px < res; px++) {
      const x = (px - R) / R, r2 = x * x + y * y, o = (py * res + px) * 4;
      if (r2 > 1) { out.data[o + 3] = 255; continue; }
      const z = Math.sqrt(1 - r2);
      const v = x * st - z * ct;
      let light = 0.5 + v / (2 * 0.055);
      light = light < 0 ? 0 : light > 1 ? 1 : light;
      const tx = Math.min(TEXN - 1, Math.floor(px * step));
      const b = Math.round(texData[ty * TEXN + tx] * (0.03 + 0.97 * light) * 255);
      out.data[o] = out.data[o + 1] = out.data[o + 2] = b; out.data[o + 3] = 255;
    }
  }
  og.putImageData(out, 0, 0);
  const disc = N * 0.86;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, (N - disc) / 2, (N - disc) / 2, disc, disc);
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
let cur = null; // {y, m, d}

function fmtDate(y, m, d) { return `${y} 年 ${m + 1} 月 ${d} 日`; }
function refresh() {
  if (!cur) return;
  const { y, m, d } = cur;
  const age = ageOf(y, m, d), { name, illum } = phaseOf(age);
  drawMoon($("moon"), age);
  $("phaseCn").textContent = name[0];
  $("phaseEn").textContent = name[1];
  $("dateTxt").textContent = fmtDate(y, m, d);
  try {
    $("lunarTxt").textContent = new Intl.DateTimeFormat("zh-Hans-CN-u-ca-chinese",
      { month: "long", day: "numeric" }).format(new Date(y, m, d));
  } catch (e) { $("lunarTxt").textContent = "—"; }
  $("illumTxt").textContent = (illum * 100).toFixed(1) + "%";
  $("ageTxt").textContent = age.toFixed(1) + " 天";
  $("progBar").style.width = (age / SYNODIC * 100).toFixed(1) + "%";
  const evs = EVENTS.map(([t, n]) => {
    let delta = (t - age) % SYNODIC; if (delta < 0.5) delta += SYNODIC;
    const dt = new Date(y, m, d + Math.round(delta));
    return { dt, n };
  }).sort((a, b) => a.dt - b.dt);
  const e = evs[0];
  $("nextTxt").textContent = `下一个节点：${e.n} · ${e.dt.getMonth() + 1} 月 ${e.dt.getDate()} 日`;
  buildStrip(y, m, d, age);
}

function buildStrip(y, m, d, age) {
  const strip = $("strip"); strip.innerHTML = "";
  const start = new Date(y, m, d - Math.floor(age));
  for (let i = 0; i < 12; i++) {
    const a = i * SYNODIC / 12;
    const dt = new Date(start); dt.setDate(dt.getDate() + Math.round(a));
    const fig = document.createElement("figure");
    const cv = document.createElement("canvas"); cv.width = cv.height = 144;
    drawMoon(cv, a, 160);
    const cap = document.createElement("figcaption");
    const { name, illum } = phaseOf(a);
    cap.textContent = `${dt.getMonth() + 1}/${dt.getDate()} ${name[0]}`;
    fig.appendChild(cv); fig.appendChild(cap);
    if (Math.abs(a - age) < SYNODIC / 24) fig.className = "on";
    fig.onclick = () => setDate(dt.getFullYear(), dt.getMonth(), dt.getDate());
    strip.appendChild(fig);
  }
}

function setDate(y, m, d) {
  cur = { y, m, d };
  calY = y; calM = m;
  const pad = n => String(n).padStart(2, "0");
  $("dateInput").value = `${y}-${pad(m + 1)}-${pad(d)}`;
  refresh();
}

$("dateInput").addEventListener("change", e => {
  const [y, m, d] = e.target.value.split("-").map(Number);
  if (y) setDate(y, m - 1, d);
});
$("todayBtn").onclick = () => { const t = new Date(); setDate(t.getFullYear(), t.getMonth(), t.getDate()); };
$("dlBtn").onclick = () => {
  const a = document.createElement("a");
  const pad = n => String(n).padStart(2, "0");
  a.download = `moon-${cur.y}-${pad(cur.m + 1)}-${pad(cur.d)}.png`;
  a.href = $("moon").toDataURL("image/png");
  a.click();
};

// ---------- monthly calendar ----------
let calY = null, calM = null;
function buildCal() {
  if (calY === null) return;
  $("calTitle").textContent = `${calY} 年 ${calM + 1} 月`;
  const grid = $("calGrid"); grid.innerHTML = "";
  const first = (new Date(calY, calM, 1).getDay() + 6) % 7; // Monday start
  const days = new Date(calY, calM + 1, 0).getDate();
  const today = new Date();
  for (let i = 0; i < first; i++) {
    const e = document.createElement("div"); e.className = "day empty"; grid.appendChild(e);
  }
  for (let d = 1; d <= days; d++) {
    const age = ageOf(calY, calM, d), { name, illum } = phaseOf(age);
    const cell = document.createElement("div"); cell.className = "day";
    if (today.getFullYear() === calY && today.getMonth() === calM && today.getDate() === d) cell.classList.add("today");
    if (cur && cur.y === calY && cur.m === calM && cur.d === d) cell.classList.add("on");
    const cv = document.createElement("canvas"); cv.width = cv.height = 96;
    drawMoon(cv, age, 96);
    const dn = document.createElement("div"); dn.className = "dn"; dn.textContent = d;
    const tag = document.createElement("div"); tag.className = "tag";
    if (illum > 0.985) tag.textContent = "满月";
    else if (illum < 0.015) tag.textContent = "新月";
    cell.appendChild(cv); cell.appendChild(dn); cell.appendChild(tag);
    cell.onclick = () => setDate(calY, calM, d);
    grid.appendChild(cell);
  }
}
$("calPrev").onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } buildCal(); };
$("calNext").onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } buildCal(); };

// ---------- yearly full / new moon list ----------
const FULL_NAMES = ["狼月", "雪月", "蠕虫月", "粉月", "花月", "草莓月",
                    "雄鹿月", "鲟鱼月", "玉米月", "猎人月", "海狸月", "冷月"];
const FULL_EN = ["Wolf", "Snow", "Worm", "Pink", "Flower", "Strawberry",
                 "Buck", "Sturgeon", "Corn", "Hunter's", "Beaver", "Cold"];
let listYear = null;
function buildYear() {
  if (listYear === null) return;
  $("yrTitle").textContent = `${listYear} 年满月与新月`;
  const box = $("yrList"); box.innerHTML = "";
  const items = [];
  const seenFullMonths = {};
  let prevAge = ageOf(listYear - 1, 11, 31);
  for (let m = 0; m < 12; m++) {
    const days = new Date(listYear, m + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const age = ageOf(listYear, m, d);
      if (age < prevAge) { // wrapped -> new moon happened around here
        items.push({ y: listYear, m, d, kind: "new" });
      }
      if (prevAge < SYNODIC / 2 && age >= SYNODIC / 2) {
        items.push({ y: listYear, m, d, kind: "full" });
      }
      prevAge = age;
    }
  }
  for (const it of items) {
    const row = document.createElement("div");
    row.className = "yrRow" + (it.kind === "new" ? " newMoon" : "");
    let nm;
    if (it.kind === "full") {
      const blue = seenFullMonths[it.m] ? " · 蓝月" : "";
      seenFullMonths[it.m] = true;
      nm = `<b>满月 · ${FULL_NAMES[it.m]}</b> ${FULL_EN[it.m]} Moon${blue}`;
    } else nm = `<b>新月</b>`;
    row.innerHTML = `<span class="dt">${it.m + 1} 月 ${it.d} 日</span><span class="nm">${nm}</span>`;
    row.onclick = () => setDate(it.y, it.m, it.d);
    box.appendChild(row);
  }
}
$("yrPrev").onclick = () => { listYear--; buildYear(); };
$("yrNext").onclick = () => { listYear++; buildYear(); };

const now = new Date();
calY = now.getFullYear(); calM = now.getMonth();
listYear = now.getFullYear();
setDate(now.getFullYear(), now.getMonth(), now.getDate());
buildCal(); buildYear();
loadTexture();
const _refresh0 = refresh;
refresh = function () { _refresh0(); buildCal(); };
</script>
